name: Instagram yayını
on:
  # Tetikleyici Cloudflare Worker (ig-tetikleyici): GitHub cron'u 2026-10-04'te hiç çalışmadı.
  # Durumsuz betik olduğu için GitHub cron'u geri AÇMA, ikisi birlikte çift paylaşım yapar. Eski saatler:
  #   - cron: '30 6 * * *'   # 09:30 TR → story slot 0
  #   - cron: '0 10 * * *'   # 13:00 TR → karusel
  #   - cron: '30 13 * * *'  # 16:30 TR → story slot 1
  #   - cron: '0 17 * * *'   # 20:00 TR → reel
  #   - cron: '30 18 * * *'  # 21:30 TR → story slot 2
  workflow_dispatch:
    inputs:
      tur: { description: 'story / reel / karusel', required: true, default: 'story' }
      slot: { description: 'slot (0/1/2)', required: true, default: '1' }
      kuru: { description: 'sadece göster, paylaşma', type: boolean, default: true }
concurrency: { group: instagram, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IG_USER_ID: '17841432363585455'
      MEDYA_URL: https://onlinekocun-medya.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Slot ve token
        env: { TOKEN_KEY: '${{ secrets.TOKEN_KEY }}' }
        run: |
          case "${{ github.event.schedule }}" in
            '30 6 * * *') U=story; S=0;; '30 13 * * *') U=story; S=1;; '30 18 * * *') U=story; S=2;;
            '0 10 * * *') U=karusel; S=0;; '0 17 * * *') U=reel; S=0;;
            *) U='${{ inputs.tur }}'; S='${{ inputs.slot }}';;
          esac
          echo "TUR=$U" >> $GITHUB_ENV; echo "SLOT=$S" >> $GITHUB_ENV
          T=$(openssl enc -d -aes-256-cbc -pbkdf2 -a -A -in token.enc -pass env:TOKEN_KEY)
          echo "::add-mask::$T"; echo "IG_TOKEN=$T" >> $GITHUB_ENV
          # Pazartesi sabah token yenilenir (60 günlük ömür sürekli tazelenir)
          if [ "$(TZ=Europe/Istanbul date +%u)" = 1 ] && [ "$U" = story ] && [ "$S" = 0 ]; then echo "TOKEN_YENILE=1" >> $GITHUB_ENV; fi
      - name: Paylaş
        env: { YENI_TOKEN_DOSYA: '${{ runner.temp }}/yeni' }
        run: |
          if [ "${{ inputs.kuru }}" = "true" ]; then node yayinla.mjs --tur=$TUR --slot=$SLOT --kuru; else node yayinla.mjs --tur=$TUR --slot=$SLOT; fi
      - name: Yenilenen token'ı kaydet
        env: { TOKEN_KEY: '${{ secrets.TOKEN_KEY }}' }
        run: |
          F='${{ runner.temp }}/yeni'
          [ -s "$F" ] || exit 0
          openssl enc -aes-256-cbc -pbkdf2 -a -A -salt -in "$F" -out token.enc -pass env:TOKEN_KEY
          git config user.name "story-bot"; git config user.email "story-bot@users.noreply.github.com"
          git add token.enc && git commit -m "token yenilendi $(date +%F)" && git push
